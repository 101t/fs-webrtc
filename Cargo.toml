[package]
name = "fs-webrtc"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Self-hosted, private 1:1 audio and video calls between contacts, powered by FreeSWITCH and WebRTC."
license = "MIT"
repository = "https://github.com/101t/fs-webrtc"
keywords = ["freeswitch", "webrtc", "sip", "voip", "video-call"]
categories = ["web-programming::http-server", "multimedia"]

[dependencies]
argon2 = "0.6"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
clap = { version = "4.6", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-tungstenite = "0.30"
tower-http = { version = "0.7", features = ["fs", "trace", "timeout", "sensitive-headers", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "6", features = ["axum_extras"] }
utoipa-axum = "0.3"
utoipa-scalar = { version = "0.4", features = ["axum"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# Password hashing is deliberately slow; keep tests fast in debug builds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
