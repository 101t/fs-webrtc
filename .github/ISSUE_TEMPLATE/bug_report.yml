name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: fs-webrtc version
      description: Shown on the sign-in page, or `curl https://your-server/health`
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Setup
      description: "e.g. Docker Compose on Ubuntu 24.04 VPS, browser Chrome 140 on Android"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`docker compose logs --tail 200` (remove secrets). For call problems, include the freeswitch logs."
      render: text
